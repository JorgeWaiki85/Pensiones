<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PENSIONES - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <div class="logo">P</div>
            <h1>PENSIONES</h1>
            <p>Sistema de Gestión de Pensiones</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required>
            </div>
            
            <div class="form-group">
                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" name="contraseña" placeholder="Ingrese su contraseña" required>
            </div>
            
            <button type="submit" class="btn-login">Iniciar Sesión</button>
            
            <div class="login-info">
                <p><strong>Cuentas del sistema:</strong></p>
                <p>Administrador: admin / admin123</p>
                <p>Telefonista: telefonista / tel123</p>
                <p>Ejecutivos: <em>primer nombre (sin tildes)</em> / <strong>ejec123</strong></p>
                <p class="login-info-small">Ejemplo: María Paz Inostroza entra como <em>maria</em>.</p>
            </div>
        </form>
        
        <div id="errorMessage" class="error-message"></div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
